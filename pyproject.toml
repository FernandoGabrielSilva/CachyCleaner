[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cachycleaner"
version = "1.0.0"
description = "Modern, safe, cross-platform system cleaner"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fernando Gabriel Silva" }]
dependencies = ["PySide6>=6.8,<7", "send2trash>=1.8.3"]

[project.urls]
Homepage = "https://github.com/FernandoGabrielSilva/CachyCleaner"
Repository = "https://github.com/FernandoGabrielSilva/CachyCleaner"
Releases = "https://github.com/FernandoGabrielSilva/CachyCleaner/releases"

[project.scripts]
cachycleaner = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["ui/qml/*.qml", "ui/qml/qmldir", "ui/qml/components/*.qml", "ui/i18n/*.json", "assets/*"]
