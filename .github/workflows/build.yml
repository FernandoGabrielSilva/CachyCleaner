name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libdbus-1-3 libfuse2 desktop-file-utils curl alien rpm

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build PyInstaller
        run: python -m PyInstaller CachyCleaner.spec --noconfirm

      - name: Build portable tar.gz
        run: |
          set -e
          mkdir -p dist/packages
          tar -czf "dist/packages/CachyCleaner-1.0.0-linux-${{ matrix.arch }}.tar.gz" -C dist CachyCleaner

      - name: Build packages (deb/rpm)
        if: matrix.arch == 'x86_64'
        run: |
          set -e
          VERSION=1.0.0
          mkdir -p dist/packages
          # --- deb
          sudo apt-get install -y dpkg-dev
          DEB="dist/packages/cachycleaner_${VERSION}_amd64.deb"
          mkdir -p debpkg/DEBIAN debpkg/usr/share/applications debpkg/usr/share/icons/hicolor/256x256/apps debpkg/usr/lib/CachyCleaner
          cp -a dist/CachyCleaner/. debpkg/usr/lib/CachyCleaner/
          cp packaging/linux/CachyCleaner.desktop debpkg/usr/share/applications/
          cp app/assets/icon.png debpkg/usr/share/icons/hicolor/256x256/apps/CachyCleaner.png
          printf '#!/bin/sh\nexec /usr/lib/CachyCleaner/CachyCleaner "$@"\n' > debpkg/usr/bin-wrapper
          mkdir -p debpkg/usr/bin
          mv debpkg/usr/bin-wrapper debpkg/usr/bin/cachycleaner
          chmod +x debpkg/usr/bin/cachycleaner
          INSTALLED=$(du -sk debpkg | cut -f1)
          cat > debpkg/DEBIAN/control <<EOF
          Package: cachycleaner
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Fernando Gabriel Silva <https://github.com/FernandoGabrielSilva>
          Installed-Size: ${INSTALLED}
          Depends: libegl1, libgl1, libxkbcommon-x11-0, libdbus-1-3
          Description: Modern, safe, cross-platform system cleaner
          CachyCleaner finds and safely removes caches, temporary files and junk.
          EOF
          dpkg-deb --build debpkg "$DEB"
          # --- rpm (via alien)
          alien -r --scripts "$DEB" --target-dir dist/packages || true

      - name: Build AppImage
        run: |
          chmod +x packaging/linux/build-appimage.sh
          ARCH="${{ matrix.arch }}" ./packaging/linux/build-appimage.sh --skip-build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cachycleaner-linux-${{ matrix.arch }}
          path: |
            dist/packages/*
            *.AppImage

  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller CachyCleaner.spec --noconfirm
          Compress-Archive -Path dist\CachyCleaner -DestinationPath "CachyCleaner-1.0.0-windows-${{ matrix.arch }}-portable.zip"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cachycleaner-windows-${{ matrix.arch }}
          path: "*.zip"

  windows-msi:
    name: Windows MSI (x86_64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build PyInstaller bundle
        run: python -m PyInstaller CachyCleaner.spec --noconfirm

      - name: Install WiX v4
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix extension add WixToolset.UI.wixext

      - name: Build MSI
        shell: pwsh
        run: |
          wix build packaging\windows\CachyCleaner.wxs `
            -ext WixToolset.UI.wixext `
            -o "CachyCleaner-1.0.0-windows-x86_64.msi"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cachycleaner-windows-msi
          path: "*.msi"

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build app + DMG
        run: |
          python -m PyInstaller CachyCleaner.spec --noconfirm
          mkdir -p dist/dmg
          cp -a dist/CachyCleaner.app dist/dmg/
          hdiutil create -volname CachyCleaner -srcfolder dist/dmg \
            -ov -format UDZO "CachyCleaner-1.0.0-macos-${{ matrix.arch }}.dmg"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cachycleaner-macos-${{ matrix.arch }}
          path: "*.dmg"

  release:
    name: Publish release
    needs: [linux, windows, windows-msi, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
